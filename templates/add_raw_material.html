<h2>Add New Material</h2>
<form action="{{ url_for('add_material') }}" method="POST">
    <label for="name">Material Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="diameter">Diameter:</label><br>
    <input type="text" id="diameter" name="diameter" required><br><br>

    <label for="category">Category:</label><br>
    <select id="category" name="category">
        <option value="Cotton">Cotton</option>
        <option value="Denim">Denim</option>
        <option value="Synthetic">Synthetic</option>
        <option value="General">General</option>
    </select><br><br>

    <label for="length">Length:</label><br>
    <input type="text" id="length" name="length" required><br><br>

    <label for="color">Color:</label><br>
    <input type="text" id="color" name="color" required><br><br>

    <label for="quantity">Quantity:</label><br>
    <input type="text" id="quantity" name="quantity" value="0"><br><br>

    <button type="submit">Save Material</button>
</form>
